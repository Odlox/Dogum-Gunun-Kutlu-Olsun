<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doğum Günün Kutlu Olsun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 40%, #3b1233 0%, #1c0a1b 42%, #07030a 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Buketin arkasında nefes alan yumuşak ışık */
    .aura {
      position: fixed;
      left: 50%;
      top: 42%;
      width: min(120vw, 900px);
      height: min(120vw, 900px);
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 140, 200, 0.22) 0%, rgba(170, 110, 255, 0.10) 38%, rgba(0, 0, 0, 0) 68%);
      animation: auraBreathe 7s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes auraBreathe {
      0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(0.97); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    #fx-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .bokeh {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 240, 0.55), rgba(255, 150, 210, 0) 70%);
      opacity: 0;
      animation: bokehFloat var(--bd, 9s) ease-in-out var(--bdelay, 0s) infinite;
    }

    @keyframes bokehFloat {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.8); }
      50% { opacity: var(--bo, 0.5); transform: translateY(-34px) scale(1.15); }
    }

    .fall-petal {
      position: absolute;
      top: -40px;
      width: var(--pw, 14px);
      height: calc(var(--pw, 14px) * 1.5);
      border-radius: 60% 0 60% 0;
      background: linear-gradient(135deg, var(--pc1), var(--pc2));
      opacity: 0;
      animation: petalFall var(--pd, 14s) linear var(--pdelay, 4s) infinite;
      filter: drop-shadow(0 0 4px rgba(255, 160, 210, 0.35));
    }

    @keyframes petalFall {
      0% { opacity: 0; transform: translate(0, -20px) rotate(0deg) rotateY(0deg); }
      8% { opacity: 0.9; }
      50% { transform: translate(var(--sway, 60px), 55vh) rotate(180deg) rotateY(180deg); }
      92% { opacity: 0.75; }
      100% { opacity: 0; transform: translate(calc(var(--sway, 60px) * -0.6), 112vh) rotate(380deg) rotateY(360deg); }
    }

    .bouquet-stage {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    svg#bouquet-svg {
      width: min(94vw, 760px);
      height: min(94vh, 840px);
      max-width: 100%;
      max-height: 100%;
      overflow: visible;
      filter: drop-shadow(0 22px 44px rgba(255, 120, 190, 0.20));
    }

    /* ---------- BAŞLIK ---------- */
    @keyframes birthdayTitleReveal {
      0% { opacity: 0; transform: translateY(16px) scale(0.9); filter: blur(6px); }
      65% { opacity: 1; transform: translateY(-2px) scale(1.02); filter: blur(0px); }
      100% { opacity: 1; transform: translateY(0px) scale(1); filter: blur(0px); }
    }

    @keyframes birthdayFloatBreeze {
      0%, 100% { transform: translateY(0px) rotate(-0.8deg); }
      50% { transform: translateY(-4px) rotate(0.9deg); }
    }

    .birthday-title-enter {
      opacity: 0;
      transform-origin: 400px -22px;
      animation: birthdayTitleReveal 1.15s cubic-bezier(0.22, 1, 0.36, 1) 3.35s forwards;
    }

    .birthday-title-float {
      transform-origin: 400px -22px;
      animation: birthdayFloatBreeze 5.6s ease-in-out 4.5s infinite;
    }

    .birthday-script-text {
      font-family: 'Great Vibes', cursive;
      font-size: 64px;
      letter-spacing: 1.2px;
      text-anchor: middle;
    }

    /* ---------- AŞAMA 1: SAPLAR ---------- */
    @keyframes drawStem {
      0% { stroke-dashoffset: 420; opacity: 0; }
      10% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    .stem-path {
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      animation: drawStem 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--stem-delay, 0s);
    }

    /* ---------- AŞAMA 2: YAPRAKLAR ---------- */
    @keyframes sproutLeaf {
      0% { transform: scale(0) rotate(-18deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .leaf-sprout-wrapper {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      opacity: 0;
      animation: sproutLeaf 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: var(--leaf-delay, 0.65s);
    }

    /* ---------- AŞAMA 3: ÇİÇEKLER ---------- */
    @keyframes bloomRingOpen {
      0% { transform: scale(0.02) rotate(-26deg); opacity: 0; }
      35% { opacity: 1; }
      78% { transform: scale(1.045) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .bloom-ring-enter {
      opacity: 0;
      transform-origin: 0px 0px;
      animation: bloomRingOpen 0.72s cubic-bezier(0.22, 1.28, 0.36, 1) forwards;
      animation-delay: var(--ring-delay, 1.1s);
    }

    @keyframes sheenFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .sheen-enter {
      opacity: 0;
      animation: sheenFade 1s ease-out forwards;
      animation-delay: var(--ring-delay, 1.8s);
    }

    /* ---------- AŞAMA 4: AMBALAJ ---------- */
    @keyframes wrapBackPaper {
      0% { transform: translateY(45px) scale(0.45); opacity: 0; }
      100% { transform: translateY(0px) scale(1); opacity: 1; }
    }
    @keyframes wrapLeftFlap {
      0% { transform: rotate(-24deg) scale(0.55); opacity: 0; }
      100% { transform: rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes wrapRightFlap {
      0% { transform: rotate(24deg) scale(0.55); opacity: 0; }
      100% { transform: rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes wrapFrontFoldLeft {
      0% { transform: rotate(-32deg) translateY(25px) scale(0.75); opacity: 0; }
      100% { transform: rotate(0deg) translateY(0px) scale(1); opacity: 1; }
    }
    @keyframes wrapFrontFoldRight {
      0% { transform: rotate(32deg) translateY(25px) scale(0.75); opacity: 0; }
      100% { transform: rotate(0deg) translateY(0px) scale(1); opacity: 1; }
    }
    @keyframes wrapBottomCone {
      0% { transform: scaleY(0.2) translateY(-30px); opacity: 0; }
      100% { transform: scaleY(1) translateY(0px); opacity: 1; }
    }

    .paper-back-anim { transform-origin: 400px 560px; opacity: 0; animation: wrapBackPaper 0.72s cubic-bezier(0.22, 1, 0.36, 1) 1.95s forwards; }
    .paper-left-flap-anim { transform-origin: 395px 635px; opacity: 0; animation: wrapLeftFlap 0.75s cubic-bezier(0.22, 1, 0.36, 1) 2.12s forwards; }
    .paper-right-flap-anim { transform-origin: 405px 635px; opacity: 0; animation: wrapRightFlap 0.75s cubic-bezier(0.22, 1, 0.36, 1) 2.22s forwards; }
    .paper-cone-anim { transform-origin: 400px 605px; opacity: 0; animation: wrapBottomCone 0.65s cubic-bezier(0.22, 1, 0.36, 1) 2.28s forwards; }
    .paper-fold-left-anim { transform-origin: 410px 605px; opacity: 0; animation: wrapFrontFoldLeft 0.72s cubic-bezier(0.22, 1, 0.36, 1) 2.42s forwards; }
    .paper-fold-right-anim { transform-origin: 390px 605px; opacity: 0; animation: wrapFrontFoldRight 0.72s cubic-bezier(0.22, 1, 0.36, 1) 2.54s forwards; }

    /* ---------- AŞAMA 5: KURDELE ---------- */
    @keyframes popBowLoopLeft {
      0% { transform: scale(0.1) rotate(22deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes popBowLoopRight {
      0% { transform: scale(0.1) rotate(-22deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes cinchKnot {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes unfurlTail {
      0% { transform: scaleY(0.05) scaleX(0.6); opacity: 0; }
      100% { transform: scaleY(1) scaleX(1); opacity: 1; }
    }

    .bow-loop-left-anim { transform-origin: 392px 600px; opacity: 0; animation: popBowLoopLeft 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) 2.82s forwards; }
    .bow-loop-right-anim { transform-origin: 404px 600px; opacity: 0; animation: popBowLoopRight 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) 2.88s forwards; }
    .bow-knot-anim { transform-origin: 398px 599px; opacity: 0; animation: cinchKnot 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) 2.75s forwards; }
    .bow-tail-enter-left { transform-origin: 388px 604px; opacity: 0; animation: unfurlTail 0.68s cubic-bezier(0.22, 1, 0.36, 1) 3.02s forwards; }
    .bow-tail-enter-right { transform-origin: 408px 604px; opacity: 0; animation: unfurlTail 0.68s cubic-bezier(0.22, 1, 0.36, 1) 3.08s forwards; }

    /* ---------- AŞAMA 6: SÜREKLİ HAREKET ---------- */
    @keyframes swayTopFlower {
      0%, 100% { transform: rotate(-1.6deg) translateY(0px); }
      50% { transform: rotate(2.1deg) translateY(-2.5px); }
    }
    @keyframes swayLeftFlower {
      0%, 100% { transform: rotate(-2.2deg) translate(0px, 0px); }
      50% { transform: rotate(1.7deg) translate(2px, -1.5px); }
    }
    @keyframes swayRightFlower {
      0%, 100% { transform: rotate(-1.5deg) translate(0px, 0px); }
      50% { transform: rotate(2.4deg) translate(2.5px, -2px); }
    }
    @keyframes swayLeafSlow {
      0%, 100% { transform: rotate(-2.8deg); }
      50% { transform: rotate(3.2deg); }
    }
    @keyframes swayLeafFast {
      0%, 100% { transform: rotate(2.5deg); }
      50% { transform: rotate(-3.4deg); }
    }
    @keyframes ribbonLeftSway {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      50% { transform: rotate(2.8deg) skewX(-1.4deg); }
    }
    @keyframes ribbonRightSway {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      50% { transform: rotate(-2.4deg) skewX(1.6deg); }
    }
    @keyframes petalBreathe {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.016) rotate(0.9deg); }
    }
    @keyframes sparkleAppearAndTwinkle {
      0% { opacity: 0; transform: scale(0); }
      14% { opacity: 1; transform: scale(1.18); }
      55% { opacity: 0.42; transform: scale(0.84); }
      100% { opacity: 1; transform: scale(1.12); }
    }
    @keyframes twinkleStarLoop {
      0%, 100% { opacity: 0.42; transform: scale(0.84); }
      50% { opacity: 1; transform: scale(1.14); }
    }
    @keyframes shimmerText {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    .flower-top-group { transform-origin: 415px 410px; animation: swayTopFlower 5.8s ease-in-out 2.2s infinite; }
    .flower-left-group { transform-origin: 355px 460px; animation: swayLeftFlower 5.1s ease-in-out 2.4s infinite; }
    .flower-right-group { transform-origin: 465px 475px; animation: swayRightFlower 5.5s ease-in-out 2.6s infinite; }
    .petal-outer-ring { animation: petalBreathe 4.6s ease-in-out 2.5s infinite; }
    .leaf-sway-a { animation: swayLeafSlow 4.4s ease-in-out 1.4s infinite; }
    .leaf-sway-b { animation: swayLeafFast 3.9s ease-in-out 1.5s infinite; }
    .ribbon-tail-left { transform-origin: 382px 605px; animation: ribbonLeftSway 4.8s ease-in-out 3.6s infinite; }
    .ribbon-tail-right { transform-origin: 418px 605px; animation: ribbonRightSway 5.2s ease-in-out 3.7s infinite; }
    .birthday-script-text { animation: shimmerText 3.2s ease-in-out 4.5s infinite; }

    /* Dolgu dalları: sap + baş tek parça olarak tabandan sallanır */
    @keyframes sprigSway {
      0%, 100% { transform: rotate(calc(var(--sprig-amp, 1deg) * -1)); }
      50% { transform: rotate(var(--sprig-amp, 1deg)); }
    }
    @keyframes headSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes drawStemLong {
      0% { stroke-dashoffset: 800; opacity: 0; }
      10% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    .stem-path-long {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: drawStemLong 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--stem-delay, 0s);
    }
    .sprig-sway {
      transform-origin: 404px 565px;
      animation: sprigSway var(--sprig-dur, 5.5s) ease-in-out var(--sprig-delay, 2s) infinite;
    }
    .head-sway {
      animation: headSway var(--head-dur, 3.6s) ease-in-out var(--head-delay, 2s) infinite;
    }

    .sparkle-item {
      opacity: 0;
      animation:
        sparkleAppearAndTwinkle 1.6s cubic-bezier(0.22, 1, 0.36, 1) var(--appear-delay, 3.2s) forwards,
        twinkleStarLoop var(--dur, 3.4s) ease-in-out calc(var(--appear-delay, 3.2s) + 1.6s) infinite;
    }

    #wind-sway-wrapper {
      transform-origin: 400px 790px;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .replay-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 192, 222, 0.25);
      color: #fce7f3;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .replay-btn:hover {
      background: rgba(244, 114, 182, 0.22);
      border-color: rgba(255, 192, 222, 0.55);
      transform: translateY(-1px);
    }
    .replay-btn:active { transform: scale(0.96); }
    .replay-btn svg { transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .replay-btn:hover svg { transform: rotate(-180deg); }
  </style>
</head>
<body>
  <div class="aura"></div>
  <div id="fx-layer"></div>

  <div class="bouquet-stage" id="stage" title="Rüzgar esintisi göndermek için dokunun veya fareyi hareket ettirin">
    <svg id="bouquet-svg" viewBox="0 -72 800 912" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="4.5" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>

        <!-- Çift katmanlı gölge: sıkı temas gölgesi + geniş yumuşak gölge (ışık sol üstten) -->
        <filter id="softDropShadow" x="-30%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b1" />
          <feOffset in="b1" dx="3" dy="5" result="o1" />
          <feFlood flood-color="#10020b" flood-opacity="0.55" />
          <feComposite in2="o1" operator="in" result="s1" />
          <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="b2" />
          <feOffset in="b2" dx="9" dy="22" result="o2" />
          <feFlood flood-color="#10020b" flood-opacity="0.42" />
          <feComposite in2="o2" operator="in" result="s2" />
          <feMerge>
            <feMergeNode in="s2" />
            <feMergeNode in="s1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" />
        </filter>

        <!-- Yaprak yüzeyi: kenarlar koyu, orta parlak (silindirik kıvrım) -->
        <linearGradient id="petalSideShade" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000" stop-opacity="0.24" />
          <stop offset="50%" stop-color="#fff" stop-opacity="0.09" />
          <stop offset="100%" stop-color="#000" stop-opacity="0.30" />
        </linearGradient>

        <filter id="paperFoldShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="-4" stdDeviation="7" flood-color="#7a1c46" flood-opacity="0.35" />
        </filter>

        <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#4d102c" flood-opacity="0.42" />
        </filter>

        <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.2" />
        </filter>

        <!-- Kağıt desen: ince noktalar -->
        <pattern id="paperDots" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
          <circle cx="3.5" cy="3.5" r="1.15" fill="#ffffff" opacity="0.34" />
          <circle cx="11" cy="11" r="1.15" fill="#ffffff" opacity="0.34" />
        </pattern>

        <linearGradient id="paperBackInner" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f9a7c7" />
          <stop offset="50%" stop-color="#e56e9e" />
          <stop offset="100%" stop-color="#b94274" />
        </linearGradient>
        <linearGradient id="paperDeepCavity" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#9e315f" />
          <stop offset="60%" stop-color="#6b1b3e" />
          <stop offset="100%" stop-color="#470f28" />
        </linearGradient>
        <linearGradient id="paperLeftFlap" x1="0%" y1="15%" x2="95%" y2="85%">
          <stop offset="0%" stop-color="#ffc6dc" />
          <stop offset="28%" stop-color="#f68cb7" />
          <stop offset="78%" stop-color="#e36498" />
          <stop offset="100%" stop-color="#bf4275" />
        </linearGradient>
        <linearGradient id="paperRightFlap" x1="100%" y1="15%" x2="5%" y2="85%">
          <stop offset="0%" stop-color="#ffcade" />
          <stop offset="32%" stop-color="#f484b1" />
          <stop offset="80%" stop-color="#dc5b90" />
          <stop offset="100%" stop-color="#b5396c" />
        </linearGradient>
        <linearGradient id="paperFrontLeftFold" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#ffc0d8" />
          <stop offset="40%" stop-color="#f07ca9" />
          <stop offset="100%" stop-color="#c94b7e" />
        </linearGradient>
        <linearGradient id="paperFrontRightFold" x1="85%" y1="0%" x2="15%" y2="100%">
          <stop offset="0%" stop-color="#ffc6dc" />
          <stop offset="45%" stop-color="#ee78a6" />
          <stop offset="100%" stop-color="#be4174" />
        </linearGradient>
        <linearGradient id="paperBottomCone" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#f68cb7" />
          <stop offset="55%" stop-color="#e6679b" />
          <stop offset="100%" stop-color="#bd3f72" />
        </linearGradient>

        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1e5c26" />
          <stop offset="50%" stop-color="#3f9a47" />
          <stop offset="100%" stop-color="#194a1f" />
        </linearGradient>
        <linearGradient id="leafLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6fcb68" />
          <stop offset="55%" stop-color="#37893a" />
          <stop offset="100%" stop-color="#1c5220" />
        </linearGradient>
        <linearGradient id="leafDarkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#17441b" />
          <stop offset="60%" stop-color="#2d7731" />
          <stop offset="100%" stop-color="#4fae4d" />
        </linearGradient>

        <linearGradient id="satinLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="35%" stop-color="#f4eff8" />
          <stop offset="72%" stop-color="#d4cadd" />
          <stop offset="100%" stop-color="#a89bb5" />
        </linearGradient>
        <linearGradient id="satinLoopInner" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#9e90ac" />
          <stop offset="50%" stop-color="#cbc0d6" />
          <stop offset="100%" stop-color="#ece6f2" />
        </linearGradient>
        <linearGradient id="satinTailGrad" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#d8cfe0" />
          <stop offset="28%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#ebe5f0" />
          <stop offset="100%" stop-color="#c3b7cf" />
        </linearGradient>
        <radialGradient id="knotGrad" cx="38%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="55%" stop-color="#e8e1ef" />
          <stop offset="100%" stop-color="#b4a7c2" />
        </radialGradient>
        <radialGradient id="pearlGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ffffff" />

  <script>
    (function () {
      const SVG_NS = "http://www.w3.org/2000/svg";

      function createSvgElement(tag, attrs = {}) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [key, val] of Object.entries(attrs)) el.setAttribute(key, val);
        return el;
      }

      // ---------- Renk yardımcıları ----------
      function hexToRgb(h) {
        h = h.replace("#", "");
        return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
      }
      function mix(a, b, t) {
        const A = hexToRgb(a), B = hexToRgb(b);
        const c = A.map((v, i) => Math.round(v + (B[i] - v) * t));
        return "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");
      }

      function addGradient(defs, id, stops) {
        const old = document.getElementById(id);
        if (old) old.remove();
        const g = createSvgElement("linearGradient", { id, x1: "0%", y1: "100%", x2: "0%", y2: "0%" });
        stops.forEach(([o, c]) => g.appendChild(createSvgElement("stop", { offset: o, "stop-color": c })));
        defs.appendChild(g);
      }

      /**
       * Çok katmanlı krizantem: derinlik gölgesi, renk varyasyonu,
       * altın merkez ve ışık yansıması ile.
       */
      function buildChrysanthemum(container, config) {
        container.innerHTML = "";
        const defs = document.querySelector("#bouquet-svg defs");

        // Üç ton: 0 normal, 1 açık, 2 derin
        const gIds = [0, 1, 2].map(i => `petalGrad_${config.id}_${i}`);
        addGradient(defs, gIds[0], [
          ["0%", config.baseDark], ["42%", config.midColor], ["82%", config.tipColor], ["100%", config.highlightTip]
        ]);
        addGradient(defs, gIds[1], [
          ["0%", mix(config.baseDark, config.midColor, 0.5)],
          ["42%", mix(config.midColor, config.tipColor, 0.5)],
          ["82%", mix(config.tipColor, config.highlightTip, 0.55)],
          ["100%", mix(config.highlightTip, "#ffffff", 0.7)]
        ]);
        addGradient(defs, gIds[2], [
          ["0%", mix(config.baseDark, "#000000", 0.3)],
          ["42%", mix(config.midColor, config.baseDark, 0.5)],
          ["82%", mix(config.midColor, config.tipColor, 0.45)],
          ["100%", config.tipColor]
        ]);

        let seed = config.seed;
        function rand() {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        }

        const rings = [
          { count: 38, len: config.radius * 1.02, width: config.petalW * 1.05, outer: true },
          { count: 34, len: config.radius * 0.91, width: config.petalW * 1.00, outer: true },
          { count: 32, len: config.radius * 0.80, width: config.petalW * 0.94, outer: false },
          { count: 28, len: config.radius * 0.68, width: config.petalW * 0.88, outer: false },
          { count: 24, len: config.radius * 0.56, width: config.petalW * 0.80, outer: false },
          { count: 20, len: config.radius * 0.44, width: config.petalW * 0.72, outer: false },
          { count: 16, len: config.radius * 0.33, width: config.petalW * 0.64, outer: false },
          { count: 12, len: config.radius * 0.23, width: config.petalW * 0.56, outer: false },
          { count: 8,  len: config.radius * 0.14, width: config.petalW * 0.48, outer: false }
        ];
        const totalRings = rings.length;

        rings.forEach((ring, ringIndex) => {
          const innerToOuterOrder = totalRings - 1 - ringIndex;
          const ringOpenDelay = (config.bloomStart + innerToOuterOrder * 0.06).toFixed(3);

          const bloomWrapper = createSvgElement("g", {
            class: "bloom-ring-enter",
            style: `--ring-delay: ${ringOpenDelay}s;`
          });

          // Bu halkanın altındaki katmanlara gölge düşürür
          if (ringIndex > 0) {
            // Gölge ışığın tersine (sağ-alt) kayık ve yumuşatılmış
            bloomWrapper.appendChild(createSvgElement("circle", {
              cx: (ring.len * 0.04).toFixed(1),
              cy: (ring.len * 0.06).toFixed(1),
              r: (ring.len * 1.0).toFixed(1),
              fill: "url(#depthShadow)",
              filter: "url(#shadowBlur)"
            }));
          }

          const swayRingGroup = createSvgElement("g", {
            class: ring.outer ? "petal-outer-ring" : "",
            style: ring.outer ? `animation-delay: ${(2.4 + ringIndex * 0.35 + config.phase).toFixed(2)}s;` : ""
          });

          for (let i = 0; i < ring.count; i++) {
            const baseAngle = (360 / ring.count) * i + ringIndex * 11.5;
            const angle = baseAngle + (rand() - 0.5) * 5.2;
            const rad = (angle * Math.PI) / 180;
            const perspectiveScale = 1 - 0.08 * Math.abs(Math.sin(rad));
            const length = ring.len * perspectiveScale * (0.92 + rand() * 0.15);
            const width = ring.width * (0.92 + rand() * 0.15);
            const curveBend = (rand() - 0.5) * width * 0.95;

            // Renk tonu seçimi: dış halkalar daha derin, iç halkalar daha parlak
            const r = rand();
            let v;
            if (ringIndex < 2) v = r < 0.3 ? 2 : (r < 0.8 ? 0 : 1);
            else if (ringIndex < 5) v = r < 0.2 ? 2 : (r < 0.6 ? 0 : 1);
            else v = r < 0.72 ? 1 : 0;

            const petalHolder = createSvgElement("g", { transform: `rotate(${angle.toFixed(2)})` });

            const d = `
              M 0, 2
              C ${-width * 0.62}, ${-length * 0.26}
                ${-width * 0.52 + curveBend * 0.4}, ${-length * 0.72}
                ${curveBend}, ${-length}
              C ${width * 0.52 + curveBend * 0.4}, ${-length * 0.72}
                ${width * 0.62}, ${-length * 0.26}
                0, 2 Z
            `;

            petalHolder.appendChild(createSvgElement("path", {
              d,
              fill: `url(#${gIds[v]})`,
              stroke: config.strokeColor,
              "stroke-width": "0.55",
              "stroke-opacity": "0.5"
            }));

            // Silindirik kenar gölgesi
            petalHolder.appendChild(createSvgElement("path", { d, fill: "url(#petalSideShade)" }));

            // Yönlü ışık: ışık sol üstten gelir; ışığa dönük yapraklar parlar, ters olanlar kararır
            const lit = Math.sin(rad) * -0.55 + (-Math.cos(rad)) * -0.83;
            if (lit > 0.08) {
              petalHolder.appendChild(createSvgElement("path", { d, fill: "#ffffff", opacity: (lit * 0.17).toFixed(3) }));
            } else if (lit < -0.08) {
              petalHolder.appendChild(createSvgElement("path", { d, fill: "#0a0010", opacity: (-lit * 0.32).toFixed(3) }));
            }

            // Orta damar
            petalHolder.appendChild(createSvgElement("path", {
              d: `M 0, -4 Q ${curveBend * 0.45}, ${-length * 0.52} ${curveBend * 0.92}, ${-length * 0.92}`,
              stroke: config.highlightTip,
              "stroke-width": "0.8",
              "stroke-linecap": "round",
              fill: "none",
              opacity: "0.38"
            }));

            // Yan ışık çizgisi (ipeksi parlaklık)
            petalHolder.appendChild(createSvgElement("path", {
              d: `M ${-width * 0.28}, ${-length * 0.18} Q ${-width * 0.34 + curveBend * 0.3}, ${-length * 0.55} ${curveBend * 0.55 - width * 0.12}, ${-length * 0.88}`,
              stroke: "#ffffff",
              "stroke-width": "0.7",
              "stroke-linecap": "round",
              fill: "none",
              opacity: "0.2"
            }));

            swayRingGroup.appendChild(petalHolder);
          }

          bloomWrapper.appendChild(swayRingGroup);
          container.appendChild(bloomWrapper);
        });

        // Altın çekirdek (phyllotaxis dizilimli minik çiçekçikler)
        const coreGroup = createSvgElement("g", {
          class: "bloom-ring-enter",
          style: `--ring-delay: ${(config.bloomStart + 0.55).toFixed(3)}s;`
        });
        const coreR = config.radius * 0.075;
        coreGroup.appendChild(createSvgElement("circle", {
          cx: "0", cy: "0", r: (coreR * 1.35).toFixed(1), fill: config.baseDark, opacity: "0.6"
        }));
        const golden = Math.PI * (3 - Math.sqrt(5));
        for (let k = 0; k < 22; k++) {
          const rr = coreR * Math.sqrt((k + 0.5) / 22) * 1.05;
          const th = k * golden;
          coreGroup.appendChild(createSvgElement("circle", {
            cx: (Math.cos(th) * rr).toFixed(2),
            cy: (Math.sin(th) * rr).toFixed(2),
            r: (1.5 + (1 - k / 22) * 0.9).toFixed(2),
            fill: "url(#floretGrad)",
            opacity: "0.95"
          }));
        }
        container.appendChild(coreGroup);

        // Işık yansıması (üst sol)
        const sheen = createSvgElement("g", {
          class: "sheen-enter",
          style: `--ring-delay: ${(config.bloomStart + 0.9).toFixed(3)}s;`
        });
        sheen.appendChild(createSvgElement("circle", {
          cx: (-config.radius * 0.22).toFixed(1),
          cy: (-config.radius * 0.26).toFixed(1),
          r: (config.radius * 0.78).toFixed(1),
          fill: "url(#sheenGrad)"
        }));
        container.appendChild(sheen);
      }

      /** Yapraklar */
      function buildFoliage() {
        const foliageGroup = document.getElementById("foliage-leaves");
        foliageGroup.innerHTML = "";

        const leavesData = [
          { x: 545, y: 245, rot: 36,  scale: 1.05, grad: "leafLightGrad", cls: "leaf-sway-a", delay: 0.72 },
          { x: 562, y: 278, rot: 62,  scale: 0.98, grad: "leafDarkGrad",  cls: "leaf-sway-b", delay: 0.80 },
          { x: 392, y: 395, rot: -32, scale: 0.92, grad: "leafLightGrad", cls: "leaf-sway-a", delay: 0.62 },
          { x: 422, y: 405, rot: 28,  scale: 0.88, grad: "leafDarkGrad",  cls: "leaf-sway-b", delay: 0.68 },
          { x: 405, y: 448, rot: -18, scale: 0.82, grad: "leafLightGrad", cls: "leaf-sway-a", delay: 0.56 },
          { x: 448, y: 462, rot: 45,  scale: 0.86, grad: "leafLightGrad", cls: "leaf-sway-b", delay: 0.64 },
          { x: 278, y: 396, rot: -58, scale: 0.95, grad: "leafDarkGrad",  cls: "leaf-sway-b", delay: 0.76 },
          { x: 332, y: 432, rot: -42, scale: 0.85, grad: "leafLightGrad", cls: "leaf-sway-a", delay: 0.66 },
          { x: 362, y: 472, rot: -26, scale: 0.80, grad: "leafDarkGrad",  cls: "leaf-sway-b", delay: 0.58 },
          { x: 478, y: 482, rot: 38,  scale: 0.82, grad: "leafDarkGrad",  cls: "leaf-sway-a", delay: 0.70 },
          // Ek yapraklar (buketin dış kenarında daha dolgun görünüm)
          { x: 236, y: 330, rot: -74, scale: 0.90, grad: "leafLightGrad", cls: "leaf-sway-a", delay: 0.84 },
          { x: 610, y: 350, rot: 74,  scale: 0.92, grad: "leafDarkGrad",  cls: "leaf-sway-b", delay: 0.88 },
          { x: 300, y: 255, rot: -48, scale: 0.78, grad: "leafDarkGrad",  cls: "leaf-sway-a", delay: 0.92 },
          { x: 600, y: 215, rot: 52,  scale: 0.80, grad: "leafLightGrad", cls: "leaf-sway-b", delay: 0.94 }
        ];

        const leafPath = `
          M 0, 0
          C -10, -12 -24, -14 -28, -24
          C -18, -26 -14, -32 -24, -40
          C -12, -42 -10, -52 -16, -62
          C -6, -64 -2, -74 0, -84
          C 2, -74 6, -64 16, -62
          C 10, -52 12, -42 24, -40
          C 14, -32 18, -26 28, -24
          C 24, -14 10, -12 0, 0 Z
        `;

        leavesData.forEach((leaf) => {
          const holder = createSvgElement("g", {
            transform: `translate(${leaf.x}, ${leaf.y}) rotate(${leaf.rot}) scale(${leaf.scale})`
          });
          const sproutWrapper = createSvgElement("g", {
            class: "leaf-sprout-wrapper",
            style: `--leaf-delay: ${leaf.delay}s;`
          });
          const swayWrapper = createSvgElement("g", { class: leaf.cls });

          swayWrapper.appendChild(createSvgElement("path", {
            d: leafPath, fill: `url(#${leaf.grad})`, stroke: "#153d18", "stroke-width": "0.9"
          }));
          swayWrapper.appendChild(createSvgElement("path", {
            d: "M 0, -2 L 0, -76 M 0, -24 L -16, -34 M 0, -28 L 16, -36 M 0, -46 L -11, -55 M 0, -48 L 11, -56",
            stroke: "#8ae584", "stroke-width": "1.1", "stroke-linecap": "round", fill: "none", opacity: "0.55"
          }));
          // Yaprağın ışığa ters yarısı: katlanmış yaprak gölgesi
          swayWrapper.appendChild(createSvgElement("path", {
            d: "M 0,-84 C 2,-74 6,-64 16,-62 C 10,-52 12,-42 24,-40 C 14,-32 18,-26 28,-24 C 24,-14 10,-12 0,0 Z",
            fill: "#04180a", opacity: "0.28"
          }));
          sproutWrapper.appendChild(swayWrapper);
          holder.appendChild(sproutWrapper);
          foliageGroup.appendChild(holder);
        });
      }

      /** Çiçekler arasındaki boşluklara beyaz-pembe dolgu çiçekleri (cipso) */
      function buildFillers() {
        const group = document.getElementById("filler-flowers");
        group.innerHTML = "";

        const sprigs = [
          { d: "M 398 565 Q 330 430 236 152", end: [236, 152], delay: 0.30 },
          { d: "M 398 565 Q 280 520 170 396", end: [170, 396], delay: 0.36 },
          { d: "M 410 565 Q 520 430 655 256", end: [655, 256], delay: 0.34 },
          { d: "M 410 565 Q 565 525 690 386", end: [690, 386], delay: 0.40 },
          { d: "M 406 565 Q 470 330 588 92", end: [588, 92], delay: 0.38 },
          { d: "M 402 565 Q 340 360 252 88", end: [252, 88], delay: 0.42 }
        ];

        let s = 777;
        const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
        const tints = ["#ffffff", "#fff0f8", "#ffe1f0", "#f1e6ff"];

        sprigs.forEach((sp, idx) => {
          // Sap + baş tek grupta: tabandan birlikte sallanır
          const sprig = createSvgElement("g", {
            class: "sprig-sway",
            style: `--sprig-dur: ${(5.2 + idx * 0.45).toFixed(2)}s; --sprig-delay: ${(1.8 + idx * 0.3).toFixed(2)}s; --sprig-amp: ${idx % 2 ? 1.1 : -1.1}deg;`
          });

          sprig.appendChild(createSvgElement("path", {
            class: "stem-path-long",
            style: `--stem-delay: ${sp.delay}s;`,
            d: sp.d,
            stroke: "#3f8f47",
            "stroke-width": "2.4",
            "stroke-linecap": "round",
            fill: "none"
          }));

          const [ex, ey] = sp.end;
          // Baş, sapın ucuna sabitlenir; kendi ekseni de sap ucudur
          const anchor = createSvgElement("g", { transform: `translate(${ex}, ${ey})` });
          const cluster = createSvgElement("g", {
            class: "leaf-sprout-wrapper",
            style: `--leaf-delay: ${(1.15 + idx * 0.08).toFixed(2)}s;`
          });
          const head = createSvgElement("g", {
            class: "head-sway",
            style: `--head-dur: ${(3.4 + idx * 0.3).toFixed(1)}s; --head-delay: ${(2 + idx * 0.25).toFixed(2)}s;`
          });

          for (let k = 0; k < 9; k++) {
            const a2 = rnd() * Math.PI * 2;
            const dist = 6 + rnd() * 22;
            const px = Math.cos(a2) * dist;
            const py = Math.sin(a2) * dist;
            head.appendChild(createSvgElement("path", {
              d: `M 0 0 L ${px.toFixed(1)} ${py.toFixed(1)}`,
              stroke: "#4da155", "stroke-width": "1", "stroke-linecap": "round", fill: "none", opacity: "0.9"
            }));
            const r = 2.6 + rnd() * 2.4;
            const flower = createSvgElement("g", { transform: `translate(${px.toFixed(1)}, ${py.toFixed(1)})` });
            const tint = tints[Math.floor(rnd() * tints.length)];
            for (let q = 0; q < 5; q++) {
              const pa = (q * 72 * Math.PI) / 180;
              flower.appendChild(createSvgElement("circle", {
                cx: (Math.cos(pa) * r * 0.8).toFixed(2),
                cy: (Math.sin(pa) * r * 0.8).toFixed(2),
                r: (r * 0.62).toFixed(2),
                fill: tint,
                opacity: "0.96"
              }));
            }
            // Işığa ters taraftaki küçük gölge
            flower.appendChild(createSvgElement("circle", {
              cx: (r * 0.3).toFixed(2), cy: (r * 0.4).toFixed(2), r: (r * 0.95).toFixed(2),
              fill: "#7a3a62", opacity: "0.16"
            }));
            flower.appendChild(createSvgElement("circle", { cx: "0", cy: "0", r: (r * 0.38).toFixed(2), fill: "#ffd36b" }));
            head.appendChild(flower);
          }
          cluster.appendChild(head);
          anchor.appendChild(cluster);
          sprig.appendChild(anchor);
          group.appendChild(sprig);
        });
      }

      /** Parıltılar */
      function buildSparkles() {
        const layer = document.getElementById("sparkles-layer");
        layer.innerHTML = "";

        const stars = [
          { x: 262, y: 52,  size: 22, dur: 3.6, appear: 3.15 },
          { x: 632, y: 146, size: 28, dur: 4.1, appear: 3.28 },
          { x: 138, y: 452, size: 26, dur: 3.8, appear: 3.40 },
          { x: 642, y: 518, size: 26, dur: 4.3, appear: 3.52 },
          { x: 222, y: 562, size: 16, dur: 3.1, appear: 3.62 },
          { x: 595, y: 572, size: 12, dur: 2.9, appear: 3.70 },
          { x: 225, y: -34, size: 15, dur: 3.5, appear: 3.55 },
          { x: 575, y: -32, size: 16, dur: 3.9, appear: 3.65 },
          { x: 720, y: 300, size: 14, dur: 3.3, appear: 3.75 },
          { x: 80,  y: 330, size: 13, dur: 3.7, appear: 3.80 },
          { x: 470, y: -62, size: 11, dur: 3.2, appear: 3.85 }
        ];

        const dots = [
          { x: 210, y: 92,  r: 2.8, dur: 2.8, appear: 3.20 },
          { x: 164, y: 138, r: 3.2, dur: 3.4, appear: 3.30 },
          { x: 100, y: 238, r: 2.2, dur: 2.6, appear: 3.38 },
          { x: 92,  y: 325, r: 2.8, dur: 3.5, appear: 3.45 },
          { x: 124, y: 392, r: 2.1, dur: 2.7, appear: 3.50 },
          { x: 196, y: 498, r: 2.5, dur: 3.2, appear: 3.58 },
          { x: 168, y: 552, r: 2.0, dur: 2.5, appear: 3.66 },
          { x: 604, y: 74,  r: 3.2, dur: 3.3, appear: 3.24 },
          { x: 698, y: 232, r: 2.2, dur: 2.9, appear: 3.36 },
          { x: 706, y: 416, r: 2.5, dur: 3.1, appear: 3.48 },
          { x: 676, y: 468, r: 2.0, dur: 2.6, appear: 3.60 },
          { x: 330, y: -52, r: 2.0, dur: 3.0, appear: 3.72 },
          { x: 520, y: -50, r: 2.4, dur: 2.8, appear: 3.78 }
        ];

        stars.forEach((s) => {
          const g = createSvgElement("g", { transform: `translate(${s.x}, ${s.y})` });
          const inner = createSvgElement("g", {
            class: "sparkle-item",
            style: `--dur: ${s.dur}s; --appear-delay: ${s.appear}s;`,
            filter: "url(#starGlow)"
          });
          inner.appendChild(createSvgElement("circle", {
            cx: "0", cy: "0", r: (s.size * 0.65).toFixed(1), fill: "url(#sparkleCore)", opacity: "0.7"
          }));
          const rO = s.size, rI = s.size * 0.16;
          inner.appendChild(createSvgElement("path", {
            d: `M 0,${-rO} Q ${rI * 0.4},${-rI * 0.4} ${rO},0 Q ${rI * 0.4},${rI * 0.4} 0,${rO} Q ${-rI * 0.4},${rI * 0.4} ${-rO},0 Q ${-rI * 0.4},${-rI * 0.4} 0,${-rO} Z`,
            fill: "#fff5fb"
          }));
          g.appendChild(inner);
          layer.appendChild(g);
        });

        dots.forEach((d) => {
          const g = createSvgElement("g", { transform: `translate(${d.x}, ${d.y})` });
          g.appendChild(createSvgElement("circle", {
            cx: "0", cy: "0", r: d.r, fill: "#ffd6ee", class: "sparkle-item",
            style: `--dur: ${d.dur}s; --appear-delay: ${d.appear}s;`,
            filter: "url(#starGlow)"
          }));
          layer.appendChild(g);
        });
      }

      function renderAllBouquetParts() {
        buildChrysanthemum(document.getElementById("flower-purple"), {
          id: "purple", radius: 166, petalW: 16.5,
          baseDark: "#3d1a73", midColor: "#7e46c9", tipColor: "#b88ff5", highlightTip: "#eadcff",
          strokeColor: "#2c0f57", seed: 104729, phase: 0.2, bloomStart: 0.95
        });
        buildChrysanthemum(document.getElementById("flower-pink"), {
          id: "pink", radius: 146, petalW: 15.2,
          baseDark: "#8f1f48", midColor: "#e65584", tipColor: "#ff93b8", highlightTip: "#ffdce9",
          strokeColor: "#6c1232", seed: 224737, phase: 1.5, bloomStart: 1.18
        });
        buildChrysanthemum(document.getElementById("flower-blue"), {
          id: "blue", radius: 138, petalW: 14.5,
          baseDark: "#173c88", midColor: "#467ee3", tipColor: "#86b6ff", highlightTip: "#d6e8ff",
          strokeColor: "#112b63", seed: 350377, phase: 2.8, bloomStart: 1.38
        });

        buildFillers();
        buildFoliage();
        buildSparkles();
      }

      renderAllBouquetParts();

      // ---------- Arka plan efektleri: bokeh + düşen taç yapraklar ----------
      (function buildFx() {
        const fx = document.getElementById("fx-layer");
        let s = 4242;
        const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };

        for (let i = 0; i < 26; i++) {
          const b = document.createElement("div");
          b.className = "bokeh";
          const size = 14 + rnd() * 46;
          b.style.width = b.style.height = size + "px";
          b.style.left = (rnd() * 100) + "%";
          b.style.top = (rnd() * 100) + "%";
          b.style.setProperty("--bd", (7 + rnd() * 8).toFixed(1) + "s");
          b.style.setProperty("--bdelay", (rnd() * 6).toFixed(1) + "s");
          b.style.setProperty("--bo", (0.25 + rnd() * 0.4).toFixed(2));
          fx.appendChild(b);
        }

        const palettes = [
          ["#ffb3d1", "#f06292"],
          ["#d9c2ff", "#9b6be0"],
          ["#bcd7ff", "#5b8fe8"],
          ["#ffe0ee", "#f48fb1"]
        ];
        for (let i = 0; i < 16; i++) {
          const p = document.createElement("div");
          p.className = "fall-petal";
          const pal = palettes[i % palettes.length];
          p.style.left = (rnd() * 100) + "%";
          p.style.setProperty("--pw", (9 + rnd() * 10).toFixed(1) + "px");
          p.style.setProperty("--pc1", pal[0]);
          p.style.setProperty("--pc2", pal[1]);
          p.style.setProperty("--pd", (12 + rnd() * 10).toFixed(1) + "s");
          p.style.setProperty("--pdelay", (4 + rnd() * 14).toFixed(1) + "s");
          p.style.setProperty("--sway", ((rnd() - 0.5) * 160).toFixed(0) + "px");
          fx.appendChild(p);
        }
      })();

      // Tekrar oynat
      const replayBtn = document.getElementById("replay-btn");
      replayBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const svg = document.getElementById("bouquet-svg");
        const clone = svg.cloneNode(true);
        svg.parentNode.replaceChild(clone, svg);
        renderAllBouquetParts();
      });

      // Rüzgar etkileşimi
      const stage = document.getElementById("stage");
      let resetTimer = null;

      function setWind(angle, hold) {
        const w = document.getElementById("wind-sway-wrapper");
        if (!w) return;
        w.style.transform = `rotate(${angle}deg)`;
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          const c = document.getElementById("wind-sway-wrapper");
          if (c) c.style.transform = "rotate(0deg)";
        }, hold);
      }

      stage.addEventListener("mousemove", (e) => {
        setWind(((e.clientX / window.innerWidth - 0.5) * 2 * 3.2).toFixed(2), 1200);
      });
      stage.addEventListener("click", (e) => {
        setWind(e.clientX < window.innerWidth / 2 ? 3.8 : -3.8, 1400);
      });
      stage.addEventListener("touchstart", (e) => {
        if (e.touches && e.touches[0]) {
          setWind(((e.touches[0].clientX / window.innerWidth - 0.5) * 2 * 3.2).toFixed(2), 1200);
        }
      }, { passive: true });
    })();
  </script>
